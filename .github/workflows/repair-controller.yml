name: Repair controller from green snapshot

on:
  push:
    branches:
      - audit/p0-foundation
    paths:
      - .github/workflows/repair-controller.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: audit/p0-foundation
          fetch-depth: 0

      - name: Restore green controller and apply narrow safety patch
        shell: bash
        run: |
          set -euo pipefail
          git show ba8c2b0bd6de5056a32ce808b3a4af1df501a142:electron/main/lifecycle/AnalysisController.ts > electron/main/lifecycle/AnalysisController.ts
          python3 <<'PY'
          from pathlib import Path

          path = Path('electron/main/lifecycle/AnalysisController.ts')
          source = path.read_text(encoding='utf-8')

          source = source.replace("import { OutcomeEvaluator } from '../brain/OutcomeEvaluator';\n", '')
          source = source.replace(
              "import { EmbeddedBrowserManager } from '../view/EmbeddedBrowserManager';\n",
              "import { EmbeddedBrowserManager } from '../view/EmbeddedBrowserManager';\nimport { deriveVerifiedPriceOutcome } from '../trade/verifiedTradeOutcome';\n",
          )
          source = source.replace('RiskLevel, TradeOutcome, SignalStatusLabel', 'RiskLevel, SignalStatusLabel')
          source = source.replace('  private outcomeEvaluator: OutcomeEvaluator;\n', '')
          source = source.replace('    this.outcomeEvaluator = new OutcomeEvaluator();\n', '')

          result_handler_start = source.index('    EmbeddedBrowserManager.getInstance().setTradeResultHandler')
          result_handler_end = source.index('\n\n    if (database)', result_handler_start)
          source = source[:result_handler_start] + source[result_handler_end:]

          lifecycle_start = source.index('  private updateTradeLifecycle(observation: any): void {')
          lifecycle_end = source.index('\n  private createTrackedTrade(', lifecycle_start)
          lifecycle_method = '''  private updateTradeLifecycle(observation: any): void {
            const manager = TradeLifecycleManager.getInstance();
            const activeTrades = manager.getActiveTrades();
            if (activeTrades.length === 0) return;

            const now = Date.now();
            let anyResolved = false;

            for (const trade of activeTrades) {
              if (trade.expiryTimestamp > now) continue;

              // Expiry changes the trade to a pending-evidence state. Never create
              // a WIN/LOSS/DRAW label from a missing, stale or cross-asset price.
              manager.handleTradeExpiry(trade.id);
              const verified = deriveVerifiedPriceOutcome(trade, observation);
              if (!verified) continue;

              if (manager.resolveTradeOutcome(
                trade.id,
                verified.outcome,
                verified.completionPrice,
              )) {
                anyResolved = true;
              }
            }

            if (anyResolved) this.emitPerformanceRefresh();
          }
'''
          source = source[:lifecycle_start] + lifecycle_method + source[lifecycle_end:]

          click_start = source.index('  private handleDetectedTradeClick(')
          click_tail = source[click_start:]
          click_tail = click_tail.replace(
              "    if (!this.isValidAssetName(asset)) {\n      asset = 'OTC ASSET';\n    }",
              "    if (!this.isValidAssetName(asset)) {\n      asset = null;\n    }",
              1,
          )
          click_tail = click_tail.replace(
              "    if (!entryPrice) {\n      entryPrice = 1.0;\n    }\n",
              '',
              1,
          )
          click_tail = click_tail.replace(
              '    TradeLifecycleManager.getInstance().registerTrade({\n',
              '    const registeredTrade = TradeLifecycleManager.getInstance().registerTrade({\n',
              1,
          )
          click_tail = click_tail.replace(
              '      eventId: event.eventId,\n      direction: event.action,',
              "      eventId: event.eventId,\n      executionId: typeof (event as any).executionId === 'string' ? (event as any).executionId : undefined,\n      platformMode: (event as any).platformMode,\n      direction: event.action,",
              1,
          )
          click_tail = click_tail.replace(
              '      entryPrice: entryPrice.toString(),',
              '      entryPrice: entryPrice ? entryPrice.toString() : null,',
              1,
          )
          click_tail = click_tail.replace(
              '    });\n\n    this.lastTradeStatusState =',
              "    });\n\n    // The UI and confirmation sound may change only after durable registration.\n    if (!registeredTrade) return;\n    const confirmedSignalId = registeredTrade.signalId || `trade-${registeredTrade.id}`;\n\n    this.lastTradeStatusState =",
              1,
          )
          click_tail = click_tail.replace('      const remaining = expirySeconds;', '      const remaining = registeredTrade.expirySeconds;', 1)
          click_tail = click_tail.replace('          signalId,', '          signalId: confirmedSignalId,', 1)
          click_tail = click_tail.replace('          originalAction: event.action,', '          originalAction: registeredTrade.direction,', 1)
          click_tail = click_tail.replace(
              '          originalConfidence: activeSignalMatches ? (this.activeSignal!.originalConfidence ?? 0) : 0,',
              '          originalConfidence: registeredTrade.confidence ?? 0,',
              1,
          )
          click_tail = click_tail.replace('          entryTimestamp: Date.now(),', '          entryTimestamp: registeredTrade.entryTimestamp,', 1)
          click_tail = click_tail.replace('          recommendedExpiry: expiryLabel,', '          recommendedExpiry: registeredTrade.expiryLabel || expiryLabel,', 1)
          click_tail = click_tail.replace(
              "          reason: activeSignalMatches ? (this.activeSignal!.originalReasons[0] || 'Signal execution') : 'Manual trade entry',",
              "          reason: registeredTrade.reasons?.[0] || 'Verified trade execution',",
              1,
          )
          source = source[:click_start] + click_tail

          required = [
              "deriveVerifiedPriceOutcome(trade, observation)",
              "executionId: typeof (event as any).executionId",
              "if (!registeredTrade) return;",
              "asset = null;",
              "entryPrice: entryPrice ? entryPrice.toString() : null",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Missing required repairs: {missing}')
          forbidden = ["asset = 'OTC ASSET'", 'entryPrice = 1.0', "TradeOutcome.UNRESOLVED,\n            '0'"]
          present = [item for item in forbidden if item in source]
          if present:
              raise SystemExit(f'Unsafe fallback survived: {present}')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit repaired controller
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-controller.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/main/lifecycle/AnalysisController.ts .github/workflows/repair-controller.yml
          git commit -m 'fix: apply verified expiry guard to green controller'
          git push origin HEAD:audit/p0-foundation
