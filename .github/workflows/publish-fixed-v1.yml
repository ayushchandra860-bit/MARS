name: Publish MARS Fixed Version 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release/publish-fixed-v1

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-mars-fixed-v1
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Verify and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: v3.0.1-rc.1

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          & npm ci 2>&1 | Tee-Object -FilePath ci-logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify app
        shell: pwsh
        run: |
          & npm run verify:ipc 2>&1 | Tee-Object -FilePath ci-logs/ipc-audit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run test 2>&1 | Tee-Object -FilePath ci-logs/vitest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run build 2>&1 | Tee-Object -FilePath ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executables
        shell: pwsh
        run: |
          & npm exec electron-builder -- --win --x64 --publish never 2>&1 | Tee-Object -FilePath ci-logs/electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create direct-download prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const body = [
              'MARS PRO V3 Fixed Version 1 release candidate.',
              '',
              'Includes a Windows installer, portable executable and SHA-256 checksums.',
              'Calibration is evidence-gated and learns only from complete verified LIVE outcomes.',
              'This is decision-support software, not a profit guarantee. Start in DEMO mode and use strict risk limits.',
              'This build is unsigned, so Windows SmartScreen may show an unknown-publisher warning.',
            ].join('\n');
            try {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner, repo: context.repo.repo, tag,
                });
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner, repo: context.repo.repo,
                  release_id: existing.data.id,
                  name: `MARS PRO V3 ${tag}`, body, prerelease: true, draft: false,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.repos.createRelease({
                  owner: context.repo.owner, repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: `MARS PRO V3 ${tag}`,
                  body,
                  prerelease: true,
                  draft: false,
                });
              }
              fs.writeFileSync('ci-logs/release-create.log', `Created or updated ${tag} at ${context.sha}.\n`);
            } catch (error) {
              const message = `Release API failed: ${error.status || 'unknown'} ${error.message}`;
              fs.writeFileSync('ci-logs/release-create.log', `${message}\n`);
              const title = 'MARS Fixed Version 1 release failure';
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
              });
              const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body: `${message}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                  title, body: `${message}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
              }
              throw error;
            }

      - name: Generate checksums and upload assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = 'ci-logs/release-upload.log'
          try {
            $executables = @(Get-ChildItem release -Filter *.exe -File)
            if ($executables.Count -lt 2) { throw 'Expected installer and portable executable.' }
            $checksums = $executables | ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
            $checksums | Set-Content -Encoding utf8 release/SHA256SUMS.txt
            $assets = @($executables) + @(Get-Item release/SHA256SUMS.txt)
            foreach ($asset in $assets) {
              "Uploading $($asset.Name), $($asset.Length) bytes." | Add-Content $log
              & gh release upload $env:RELEASE_TAG "$($asset.FullName)" --clobber 2>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -ne 0) { throw "Could not upload $($asset.Name)." }
            }
            'All release assets uploaded.' | Add-Content $log
          } catch {
            ($_ | Out-String) | Add-Content $log
            throw
          }

      - name: Publish release failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = 'MARS Fixed Version 1 release failure';
            const directory = path.join(process.env.GITHUB_WORKSPACE, 'ci-logs');
            const names = fs.existsSync(directory)
              ? fs.readdirSync(directory).filter((name) => name.endsWith('.log')).sort()
              : [];
            const sections = names.map((name) => {
              const text = fs.readFileSync(path.join(directory, name), 'utf8');
              const lines = text.replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).slice(-80);
              return `#### ${name}\n\n\`\`\`text\n${lines.join('\n').slice(-7000)}\n\`\`\``;
            });
            const body = `Release commit: \`${context.sha}\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${sections.join('\n\n').slice(-45000) || 'No stage log was produced.'}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title, body });
            }

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARS-Fixed-V1-release-logs-${{ github.run_number }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7
