name: Publish MARS Fixed Version 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release/publish-fixed-v1

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-mars-fixed-v1
  cancel-in-progress: false

jobs:
  publish-windows:
    name: Verify and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: v3.0.1-rc.1

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          & npm ci 2>&1 | Tee-Object -FilePath ci-logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify IPC, types, tests and production build
        shell: pwsh
        run: |
          & npm run verify:ipc 2>&1 | Tee-Object -FilePath ci-logs/ipc-audit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run test 2>&1 | Tee-Object -FilePath ci-logs/vitest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run build 2>&1 | Tee-Object -FilePath ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installer and portable app
        shell: pwsh
        run: |
          & npm exec electron-builder -- --win --x64 --publish never 2>&1 | Tee-Object -FilePath ci-logs/electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executables = @(Get-ChildItem release -Filter *.exe -File)
          if ($executables.Count -lt 2) { throw 'Expected both NSIS and portable executables.' }
          $checksums = $executables | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          Get-ChildItem release | Format-Table Name,Length

      - name: Publish direct-download GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = 'ci-logs/release-publish.log'
          try {
            $marker = (Get-Content .github/release/publish-fixed-v1 -Raw).Trim()
            if ($marker -ne $env:RELEASE_TAG) { throw 'Publish marker does not match RELEASE_TAG.' }
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            if ("v$($package.version)" -ne $env:RELEASE_TAG) {
              throw "Package version $($package.version) does not match $env:RELEASE_TAG."
            }
            $assets = @(Get-ChildItem release -File | Where-Object {
              $_.Extension -eq '.exe' -or $_.Name -eq 'SHA256SUMS.txt'
            })
            if ($assets.Count -lt 3) { throw 'Installer, portable app or checksum file is missing.' }
            "Validated $($assets.Count) release assets." | Set-Content -Encoding utf8 $log

            @"
            MARS PRO V3 Fixed Version 1 release candidate.

            Includes a Windows installer, portable executable and SHA-256 checksums.
            Calibration is evidence-gated and learns only from complete verified LIVE outcomes.
            This is decision-support software, not a profit guarantee. Start in DEMO mode and use strict risk limits.
            The build is unsigned, so Windows SmartScreen may show an unknown-publisher warning.
            "@ | Set-Content -Encoding utf8 release/RELEASE_NOTES.md

            & gh release view $env:RELEASE_TAG *> $null
            $releaseExists = $LASTEXITCODE -eq 0
            if (-not $releaseExists) {
              & gh release create $env:RELEASE_TAG --target "$env:GITHUB_SHA" --title "MARS PRO V3 $env:RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --prerelease 2>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub prerelease.' }
            }

            foreach ($asset in $assets) {
              "Uploading $($asset.Name) ($($asset.Length) bytes)." | Add-Content $log
              & gh release upload $env:RELEASE_TAG "$($asset.FullName)" --clobber 2>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -ne 0) { throw "Could not upload $($asset.Name)." }
            }
            & gh release edit $env:RELEASE_TAG --title "MARS PRO V3 $env:RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --prerelease 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw 'Could not update release metadata.' }
            'Release publication completed.' | Add-Content $log
          } catch {
            ($_ | Out-String) | Add-Content $log
            throw
          }

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARS-PRO-V3-Fixed-Version-1-Windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release failure diagnostic
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = 'MARS Fixed Version 1 release failure';
            const directory = path.join(process.env.GITHUB_WORKSPACE, 'ci-logs');
            const names = fs.existsSync(directory)
              ? fs.readdirSync(directory).filter((name) => name.endsWith('.log')).sort()
              : [];
            const sections = names.map((name) => {
              const text = fs.readFileSync(path.join(directory, name), 'utf8');
              const lines = text.replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).slice(-100);
              return `#### ${name}\n\n\`\`\`text\n${lines.join('\n').slice(-9000)}\n\`\`\``;
            });
            const body = `Release commit: \`${context.sha}\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${sections.join('\n\n').slice(-55000) || 'No stage log was produced.'}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title, body });
            }

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARS-Fixed-V1-release-logs-${{ github.run_number }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7
