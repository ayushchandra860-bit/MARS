name: Apply RC7 runtime context correction

on:
  push:
    branches: [fix/runtime-context-state-rc7]
    paths:
      - .github/rc7/run

permissions:
  contents: write

concurrency:
  group: rc7-runtime-context
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create diagnostics directory
        run: mkdir -p ci-logs

      - name: Apply deterministic RC7 patch
        shell: bash
        run: |
          set -o pipefail
          base64 -d .github/rc7/apply.py.gz.b64 | gzip -d > /tmp/apply-rc7.py
          python3 /tmp/apply-rc7.py 2>&1 | tee ci-logs/patch.log

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ci-logs/npm-ci.log

      - name: Audit IPC contracts
        shell: bash
        run: |
          set -o pipefail
          npm run verify:ipc 2>&1 | tee ci-logs/ipc.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-logs/typecheck.log

      - name: Run exact RC7 regression
        shell: bash
        run: |
          set -o pipefail
          npm exec vitest -- run tests/runtime-context-state-rc7.test.ts 2>&1 | tee ci-logs/rc7-test.log

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee ci-logs/vitest.log

      - name: Build production bundles
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-logs/build.log

      - name: Commit verified source correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            electron/main/view/embeddedTradeDetector.ts \
            electron/main/view/embeddedEventValidation.ts \
            electron/main/view/tradeEvidenceEnrichment.ts \
            electron/main/view/EmbeddedBrowserManager.ts \
            electron/main/trade/TrustedExecutionEvidence.ts \
            electron/main/scanner/LiveScanner.ts \
            electron/main/market/DataQualityGate.ts \
            electron/main/lifecycle/AnalysisController.ts \
            frontend/src/overlay/SignalPanel.tsx \
            tests/runtime-context-state-rc7.test.ts
          if git diff --cached --quiet; then
            echo "RC7 patch produced no source changes" >&2
            exit 1
          fi
          git commit -m "fix: separate runtime market context from trade state"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save bounded failure diagnostic
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          {
            echo "RC7 runtime-context verification failed"
            echo "run=${GITHUB_RUN_ID}"
            echo
            for file in ci-logs/*.log; do
              [ -f "$file" ] || continue
              echo "===== $file ====="
              tail -n 120 "$file"
              echo
            done
          } > .github/rc7-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc7-error.txt
          git commit -m "ci: capture RC7 verification failure" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7-runtime-context-logs-${{ github.run_number }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7
