name: Finish RC5 decision-support safety

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-resume.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply, verify, and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/rc5-resume.log"
          exec > >(tee "$log") 2>&1

          on_error() {
            status=$?
            trap - ERR
            sleep 1
            git reset --hard HEAD
            cp "$log" .github/rc5-resume/error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/rc5-resume/error.log
            git commit -m "ci: capture remaining RC5 error"
            git push origin HEAD:fix/decision-support-safety-rc5
            exit "$status"
          }
          trap on_error ERR

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = (Path('.github/rc5-resume/chunk-0.b64').read_text().strip()
                     + Path('.github/rc5-resume/chunk-1.b64').read_text().strip())
          source = gzip.decompress(base64.b64decode(encoded))
          exec(compile(source, 'apply-rc5-resume.py', 'exec'), {'__name__': '__main__'})
          PY

          npm ci
          npm run verify:ipc
          npm run typecheck
          npm test -- --run
          npm run build

          trap - ERR
          rm -rf .github/rc5-resume
          rm -f .github/workflows/apply-rc5-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete disciplined decision-support safety"
          git push origin HEAD:fix/decision-support-safety-rc5
