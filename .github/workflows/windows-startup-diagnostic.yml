name: Windows Startup Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/diagnostics/windows-startup

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  startup-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build unpacked Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          & npm ci 2>&1 | Tee-Object ci-logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run build 2>&1 | Tee-Object ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm exec electron-builder -- --win --x64 --dir --publish never 2>&1 | Tee-Object ci-logs/package.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect package and test fresh plus corrupt-data startup
        shell: pwsh
        run: |
          $summary = 'ci-logs/startup-summary.txt'
          $archive = 'release/win-unpacked/resources/app.asar'
          $exe = 'release/win-unpacked/MARS PRO V3.exe'
          "Archive exists: $(Test-Path $archive)" | Set-Content $summary
          "Executable exists: $(Test-Path $exe)" | Add-Content $summary
          & node -e "const a=require('@electron/asar'); for(const f of a.listPackage(process.argv[1])) console.log(f)" $archive 2>&1 | Set-Content ci-logs/asar-files.log
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect app.asar.' }
          $asarText = (Get-Content ci-logs/asar-files.log -Raw).Replace('\','/')
          "Has sql.js JS: $($asarText.Contains('/node_modules/sql.js/dist/sql-wasm.js'))" | Add-Content $summary
          "Has sql.js WASM: $($asarText.Contains('/node_modules/sql.js/dist/sql-wasm.wasm'))" | Add-Content $summary
          "Has renderer: $($asarText.Contains('/dist/index.html'))" | Add-Content $summary
          "Has main entry: $($asarText.Contains('/dist-electron/main/main.js'))" | Add-Content $summary
          if (-not $asarText.Contains('/node_modules/sql.js/dist/sql-wasm.wasm')) { throw 'Packaged sql.js WASM is missing.' }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MarsWindowProbe {
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          '@

          function Start-MarsVisible([string]$label) {
            $stdout = Join-Path $PWD "ci-logs/$label-stdout.log"
            $stderr = Join-Path $PWD "ci-logs/$label-stderr.log"
            $env:ELECTRON_ENABLE_LOGGING = '1'
            $process = Start-Process -FilePath $exe -ArgumentList '--enable-logging' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $visible = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { break }
              foreach ($candidate in @(Get-Process -Name 'MARS PRO V3' -ErrorAction SilentlyContinue)) {
                if ($candidate.MainWindowHandle -ne 0 -and [MarsWindowProbe]::IsWindowVisible($candidate.MainWindowHandle)) {
                  $visible = $true
                  break
                }
              }
              if ($visible) { break }
            }
            $process.Refresh()
            "$label primary exited: $($process.HasExited)" | Add-Content $summary
            if ($process.HasExited) { "$label exit code: $($process.ExitCode)" | Add-Content $summary }
            "$label visible window: $visible" | Add-Content $summary
            if (-not $process.HasExited) { & taskkill /PID $process.Id /T /F 2>&1 | Out-Null }
            Start-Sleep -Seconds 1
            if ($process.HasExited -or -not $visible) { throw "$label startup did not produce a visible window." }
          }

          $userData = Join-Path $env:APPDATA 'MARS PRO V3'
          Remove-Item $userData -Recurse -Force -ErrorAction SilentlyContinue
          Start-MarsVisible 'fresh'

          Remove-Item $userData -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $userData | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $userData 'mars-pro.db'), [Text.Encoding]::UTF8.GetBytes('corrupt-primary'))
          [IO.File]::WriteAllBytes((Join-Path $userData 'mars-pro.db.bak'), [Text.Encoding]::UTF8.GetBytes('corrupt-backup'))
          Start-MarsVisible 'corrupt-data'

          $preserved = @(Get-ChildItem $userData -Filter 'mars-pro.db*.startup-failed-*' -File -ErrorAction SilentlyContinue)
          "Preserved corrupt database files: $($preserved.Count)" | Add-Content $summary
          "Fresh database exists after recovery: $(Test-Path (Join-Path $userData 'mars-pro.db'))" | Add-Content $summary
          if ($preserved.Count -lt 2) { throw 'Corrupt database files were not preserved.' }
          if (-not (Test-Path (Join-Path $userData 'mars-pro.db'))) { throw 'Fresh database was not created.' }
          Get-Content $summary

      - name: Publish startup diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- mars-startup-diagnostic -->';
            const dir = path.join(process.env.GITHUB_WORKSPACE, 'ci-logs');
            const names = fs.existsSync(dir) ? fs.readdirSync(dir).filter(n => n.endsWith('.log') || n.endsWith('.txt')).sort() : [];
            const sections = names.map(name => {
              const text = fs.readFileSync(path.join(dir, name), 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
              return `#### ${name}\n\n\`\`\`text\n${text.split(/\r?\n/).slice(-80).join('\n').slice(-8000)}\n\`\`\``;
            });
            const body = `${marker}\nCommit: \`${context.sha}\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n${sections.join('\n\n').slice(-50000)}`;
            if (context.payload.pull_request) {
              const issueNumber = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
              if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body });
            }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MARS-Windows-startup-diagnostic-${{ github.run_number }}
          path: ci-logs/*
          retention-days: 7
