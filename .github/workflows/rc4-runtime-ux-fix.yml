name: RC4 runtime UX repair

on:
  push:
    branches:
      - fix/trade-journal-learning-rc4
    paths:
      - .github/workflows/rc4-runtime-ux-fix.yml
      - .github/runtime-fix/payload.b64

permissions:
  contents: write

concurrency:
  group: rc4-runtime-ux-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-journal-learning-rc4
          fetch-depth: 0

      - name: Decode and apply audited patch
        shell: bash
        run: |
          base64 -d .github/runtime-fix/payload.b64 | xz -d > /tmp/apply-runtime-ux-fix.mjs
          node --check /tmp/apply-runtime-ux-fix.mjs
          node /tmp/apply-runtime-ux-fix.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused regression tests
        run: npx vitest run tests/runtime-user-facing-consistency.test.ts tests/sr-intelligence.test.ts tests/performance-engine.test.ts tests/trade-journal-learning-pipeline.test.ts

      - name: Commit verified product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared electron frontend tests
          git diff --cached --stat
          git commit -m "fix: restore coherent live trade UX"
          git push origin HEAD:fix/trade-journal-learning-rc4
