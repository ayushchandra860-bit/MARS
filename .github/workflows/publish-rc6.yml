name: Publish completed RC6 draft

on:
  push:
    branches: [fix/runtime-scanner-warmup-rc6]
    paths: [.github/workflows/publish-rc6.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed draft with bounded retries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '387848222'
        shell: bash
        run: |
          printf '%s\n' '{"draft":false,"prerelease":true,"name":"MARS PRO V3 v3.0.1-rc.6","tag_name":"v3.0.1-rc.6","target_commitish":"5219b8bd99ab2e14e68180472647a742899828c5"}' > /tmp/release.json
          : > /tmp/rc6-publish.log
          status=1
          for delay in 0 5 15 30 60; do
            sleep "$delay"
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input /tmp/release.json >> /tmp/rc6-publish.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              cat /tmp/rc6-publish.log
              exit 0
            fi
            printf '\nRetry after HTTP failure\n' >> /tmp/rc6-publish.log
          done
          cp /tmp/rc6-publish.log .github/rc6-publish-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/rc6-publish-error.txt
          git commit -m "ci: capture RC6 draft publish error"
          git push origin HEAD:fix/runtime-scanner-warmup-rc6
          exit "$status"
