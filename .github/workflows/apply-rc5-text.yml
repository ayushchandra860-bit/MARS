name: Apply compact RC5 safety patch

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-text.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply, verify, and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          log="$RUNNER_TEMP/rc5-text.txt"
          exec > >(tee "$log") 2>&1

          on_error() {
            status=$?
            trap - ERR
            sleep 1
            git reset --hard HEAD
            cp "$log" .github/rc5-text/error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/rc5-text/error.txt
            git commit -m "ci: capture compact RC5 error"
            git push origin HEAD:fix/decision-support-safety-rc5
            exit "$status"
          }
          trap on_error ERR

          cat .github/rc5-text/part0.py .github/rc5-text/part1.py .github/rc5-text/part2.py > "$RUNNER_TEMP/apply-rc5.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-rc5.py"
          python3 "$RUNNER_TEMP/apply-rc5.py"
          npm ci
          npm run verify:ipc
          npm run typecheck
          npm test -- --run
          npm run build

          trap - ERR
          rm -rf .github/rc5-text .github/rc5-resume
          rm -f .github/workflows/apply-rc5-text.yml .github/workflows/apply-rc5-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete RC5 decision-support hardening"
          git push origin HEAD:fix/decision-support-safety-rc5
