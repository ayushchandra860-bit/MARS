name: Finalize RC3 Source

on:
  push:
    branches: [perf/windows-render-rc3]
    paths:
      - .github/workflows/rc3-finalize-source.yml
      - scripts/rc3-finalize.mjs

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/windows-render-rc3
      - name: Apply deterministic source updates
        shell: bash
        run: |
          mkdir -p ci-logs
          node scripts/rc3-finalize.mjs 2>&1 | tee ci-logs/finalize.log
      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/main/lifecycle/AnalysisController.ts electron/main/overlay/OverlayManager.ts frontend/src/overlay/SignalPanel.tsx shared/types/ipc.ts package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: finish runtime telemetry and lightweight trade quotes'
          git push origin HEAD:perf/windows-render-rc3
      - name: Report finalizer failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- mars-rc3-finalizer -->'; echo '### RC3 source finalizer failed'; echo '```text'; tail -n 120 ci-logs/finalize.log 2>/dev/null || true; echo '```'; } > finalizer-comment.md
          gh pr comment 5 --body-file finalizer-comment.md
