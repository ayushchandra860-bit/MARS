name: Finalize RC3 Source

on:
  push:
    branches: [perf/windows-render-rc3]
    paths:
      - .github/workflows/rc3-finalize-source.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/windows-render-rc3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source updates
        shell: bash
        run: |
          mkdir -p ci-logs
          exec > >(tee ci-logs/finalize.log) 2>&1
          node <<'NODE'
          const fs = require('fs');
          const controllerPath = 'electron/main/lifecycle/AnalysisController.ts';
          let controller = fs.readFileSync(controllerPath, 'utf8');
          const startToken = '  private startScanLoop(intervalMs: number): void {';
          const endToken = '  private async runScanCycle';
          const start = controller.indexOf(startToken);
          const end = controller.indexOf(endToken, start);
          if (start < 0 || end <= start) throw new Error(`Scan-loop bounds missing: start=${start}, end=${end}`);
          const lines = [
            '  private startScanLoop(intervalMs: number): void {',
            '    this.stopScanLoop();',
            '    const scheduleNext = (): void => {',
            '      if (this.state !== AnalysisState.RUNNING) return;',
            '      this.scanTimer = setTimeout(async () => {',
            '        this.scanTimer = null;',
            '        try {',
            '          await this.runScanCycle();',
            '        } catch (err) {',
            "          console.error('[MARS] Unhandled scan cycle error:', err);",
            '        } finally {',
            '          scheduleNext();',
            '        }',
            '      }, intervalMs);',
            '    };',
            '    scheduleNext();',
            '  }',
            '',
            '  private stopScanLoop(): void {',
            '    if (this.scanTimer) {',
            '      clearTimeout(this.scanTimer);',
            '      this.scanTimer = null;',
            '    }',
            '  }',
            '',
          ];
          controller = controller.slice(0, start) + lines.join('\n') + controller.slice(end);
          fs.writeFileSync(controllerPath, controller);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit generated updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add electron/main/lifecycle/AnalysisController.ts package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: serialize scan cadence and sync rc3 metadata'
          git push origin HEAD:perf/windows-render-rc3
      - name: Report finalizer failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '<!-- mars-rc3-finalizer -->'; echo '### RC3 source finalizer failed'; echo '```text'; tail -n 120 ci-logs/finalize.log 2>/dev/null || true; echo '```'; } > finalizer-comment.md
          gh pr comment 5 --body-file finalizer-comment.md
