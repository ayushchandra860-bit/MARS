name: Merge and publish RC6 runtime hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/hotfix/run-rc6-runtime

permissions:
  contents: write

concurrency:
  group: merge-and-publish-rc6-runtime
  cancel-in-progress: false

jobs:
  verify-merge-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: v3.0.1-rc.6
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved RC6 source files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          git fetch origin fix/runtime-scanner-warmup-rc6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout origin/fix/runtime-scanner-warmup-rc6 -- `
            electron/main/lifecycle/AnalysisController.ts `
            electron/main/scanner/LiveScanner.ts `
            package.json `
            package-lock.json `
            tests/rc3-final-performance-contract.test.ts `
            tests/runtime-scanner-warmup.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: |
          & npm ci 2>&1 | Tee-Object -FilePath ci-logs/npm-ci.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit IPC contracts
        shell: pwsh
        run: |
          & npm run verify:ipc 2>&1 | Tee-Object -FilePath ci-logs/ipc-audit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck Electron and frontend
        shell: pwsh
        run: |
          & npm run typecheck 2>&1 | Tee-Object -FilePath ci-logs/typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full Vitest suite
        shell: pwsh
        run: |
          & npm run test 2>&1 | Tee-Object -FilePath ci-logs/vitest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build production bundles
        shell: pwsh
        run: |
          & npm run build 2>&1 | Tee-Object -FilePath ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installer and portable app
        shell: pwsh
        run: |
          & npm exec electron-builder -- --win --x64 --publish never 2>&1 | Tee-Object -FilePath ci-logs/electron-builder.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem -Path release -Filter *.exe -File)
          if ($files.Count -lt 2) { throw 'Installer or portable executable is missing.' }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 release/SHA256SUMS.txt

      - name: Commit verified source to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add `
            electron/main/lifecycle/AnalysisController.ts `
            electron/main/scanner/LiveScanner.ts `
            package.json `
            package-lock.json `
            tests/rc3-final-performance-contract.test.ts `
            tests/runtime-scanner-warmup.test.ts
          git commit -m "fix: recover live scanner from RC5 quality-gate stall"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = (git rev-parse HEAD).Trim()
          "MARS_RELEASE_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish RC6 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ("v$($package.version)" -ne $env:RELEASE_TAG) {
            throw "Package version $($package.version) does not match $env:RELEASE_TAG."
          }
          $files = @(Get-ChildItem -Path release -File | Where-Object {
            $_.Extension -eq '.exe' -or $_.Name -eq 'SHA256SUMS.txt'
          })
          if ($files.Count -lt 3) { throw 'Installer, portable app, or checksums are missing.' }
          $paths = $files | ForEach-Object { $_.FullName }
          @"
          RC6 fixes the live scanner quality-gate stall seen on the Windows Olymp Trade demo session.

          - aligns scanner and gate at three validated candles
          - keeps valid chart cache usable for its complete bounded lifetime
          - normalizes broker timeframe labels before validation
          - displays exact rejection details and keeps warm-up as safe WAIT
          - includes regression coverage for Maha Jantar Index, 1m, and a fresh positive quote

          MARS is manual decision-support software, not a profit guarantee. Validate this build in DEMO mode before any real use.
          "@ | Set-Content -Encoding utf8 release/RELEASE_NOTES.md
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @paths --clobber
            gh release edit $env:RELEASE_TAG --title "MARS PRO V3 $env:RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --prerelease
          } else {
            gh release create $env:RELEASE_TAG @paths --target "$env:MARS_RELEASE_TARGET" --title "MARS PRO V3 $env:RELEASE_TAG" --notes-file release/RELEASE_NOTES.md --prerelease
          }

      - name: Upload verified Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MARS-PRO-V3-RC6-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Save failure diagnostic to main
        if: failure()
        shell: pwsh
        run: |
          git reset --hard HEAD
          $logs = @(Get-ChildItem ci-logs -Filter *.log -ErrorAction SilentlyContinue | Sort-Object Name)
          $parts = foreach ($log in $logs) {
            "===== $($log.Name) ====="
            Get-Content $log.FullName -Tail 150
          }
          if (-not $parts) { $parts = @('RC6 workflow failed before a stage log was produced.') }
          $parts | Set-Content -Encoding utf8 .github/rc6-hotfix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/rc6-hotfix-error.txt
          git commit -m "ci: capture RC6 Windows hotfix error"
          if ($LASTEXITCODE -eq 0) { git push origin HEAD:main }
