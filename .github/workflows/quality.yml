name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/trade-journal-learning-rc4]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc4-source-patch:
    name: Apply RC4 trade pipeline patch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/trade-journal-learning-rc4' && github.actor != 'github-actions[bot]') || (github.event_name == 'pull_request' && github.head_ref == 'fix/trade-journal-learning-rc4')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trade-journal-learning-rc4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply resumable source patch
        id: patch
        shell: bash
        run: |
          set +e
          node scripts/rc4-trade-pipeline-finish.mjs 2>&1 | tee /tmp/rc4-patch.log
          patch_status=${PIPESTATUS[0]}
          echo "status=${patch_status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit source progress
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron frontend shared tests package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: finish trade journal and ML learning repair"
            git push origin HEAD:fix/trade-journal-learning-rc4
          fi
      - name: Report patch error
        if: steps.patch.outputs.status != '0'
        shell: bash
        run: |
          cat /tmp/rc4-patch.log
          exit 1

  ipc-contract:
    name: IPC contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ipc

  tests:
    name: Vitest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Vitest
        id: vitest
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee vitest-output.txt
          test_status=${PIPESTATUS[0]}
          echo "status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Publish Vitest failure summary
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- mars-vitest-failure -->'
            echo '### Vitest failure summary'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '<details><summary>Last 180 lines</summary>'
            echo
            echo '```text'
            tail -n 180 vitest-output.txt
            echo '```'
            echo '</details>'
          } > vitest-comment.md
          gh pr comment "$PR_NUMBER" --body-file vitest-comment.md

  typecheck:
    name: Electron and frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Production build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
