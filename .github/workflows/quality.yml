name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipc-contract:
    name: IPC contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ipc

  tests:
    name: Vitest suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Vitest
        id: vitest
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee vitest-output.txt
          test_status=${PIPESTATUS[0]}
          echo "status=${test_status}" >> "$GITHUB_OUTPUT"
          exit "${test_status}"
      - name: Publish Vitest failure summary
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- mars-vitest-failure -->'
            echo '### Vitest failure summary'
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '<details><summary>Last 180 lines</summary>'
            echo
            echo '```text'
            tail -n 180 vitest-output.txt
            echo '```'
            echo '</details>'
          } > vitest-comment.md
          gh pr comment "$PR_NUMBER" --body-file vitest-comment.md

  typecheck:
    name: Electron and frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Production build verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
