name: Publish RC4 release candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-rc4.yml

permissions:
  contents: write

concurrency:
  group: publish-v3.0.1-rc.4
  cancel-in-progress: false

jobs:
  validate-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify package version
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "3.0.1-rc.4"
          test "$(node -p "require('./package-lock.json').version")" = "3.0.1-rc.4"

      - name: IPC contract audit
        run: npm run verify:ipc

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Remove trigger and tag clean validated head
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v3.0.1-rc.4" >/dev/null; then
            echo "v3.0.1-rc.4 already exists; refusing to retag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-rc4.yml
          git commit -m "chore: remove temporary RC4 release trigger"
          git push origin HEAD:main
          git tag -a v3.0.1-rc.4 -m "MARS PRO V3 3.0.1-rc.4"
          git push origin v3.0.1-rc.4
