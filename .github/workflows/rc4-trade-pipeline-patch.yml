name: RC4 Trade Pipeline Source Patch

on:
  push:
    branches:
      - fix/trade-journal-learning-rc4
    paths:
      - scripts/rc4-trade-pipeline-fix.mjs
      - .github/workflows/rc4-trade-pipeline-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/rc4-trade-pipeline-fix.mjs
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron frontend shared tests package.json package-lock.json .github/workflows/windows-installer.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: restore trade journal counting and verified learning"
          git push origin HEAD:fix/trade-journal-learning-rc4
