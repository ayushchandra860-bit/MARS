name: Verify RC5 workflow write access

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-direct.yml

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit marker
        shell: bash
        run: |
          printf 'workflow write confirmed\n' > .github/rc5-text/workflow-marker.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/rc5-text/workflow-marker.txt
          git commit -m "ci: confirm RC5 workflow write access"
          git push origin HEAD:fix/decision-support-safety-rc5
