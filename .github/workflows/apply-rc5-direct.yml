name: Clean temporary RC5 payloads

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-direct.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary payloads
        shell: bash
        run: |
          rm -rf .github/rc5-text .github/rc5-resume
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary RC5 payloads"
          git push origin HEAD:fix/decision-support-safety-rc5
