name: Apply RC5 decision-support safety

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-safety.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch, verify, and commit
        shell: bash
        run: |
          log="$RUNNER_TEMP/rc5-verification.log"
          set +e
          (
            python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = (Path('.github/rc5-patch/chunk-0.b64').read_text().strip()
                     + Path('.github/rc5-patch/chunk-1.b64').read_text().strip())
          source = gzip.decompress(base64.b64decode(encoded))
          exec(compile(source, 'apply-rc5.py', 'exec'), {'__name__': '__main__'})
          PY
            npm ci
            npm run verify:ipc
            npm run typecheck
            npm test -- --run
            npm run build
          ) > >(tee "$log") 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp "$log" .github/rc5-patch/error.log
            git add .github/rc5-patch/error.log
            git commit -m "ci: capture RC5 verification error"
            git push origin HEAD:fix/decision-support-safety-rc5
            exit "$status"
          fi

          rm -rf .github/rc5-patch
          rm -f .github/workflows/apply-rc5-safety.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce disciplined decision-support safety"
          git push origin HEAD:fix/decision-support-safety-rc5
