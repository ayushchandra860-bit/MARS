name: Apply RC5 decision-support safety

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-safety.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safety patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/rc5-patch.log" 2>&1
          from pathlib import Path
          import base64, gzip
          encoded = (Path('.github/rc5-patch/chunk-0.b64').read_text().strip()
                     + Path('.github/rc5-patch/chunk-1.b64').read_text().strip())
          source = gzip.decompress(base64.b64decode(encoded))
          exec(compile(source, 'apply-rc5.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Show patch output
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/rc5-patch.log" || true

      - name: Save patch error for repair
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cp "$RUNNER_TEMP/rc5-patch.log" .github/rc5-patch/error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc5-patch/error.log
          git commit -m "ci: capture RC5 patch error"
          git push origin HEAD:fix/decision-support-safety-rc5
          exit 1

      - uses: actions/setup-node@v4
        if: steps.patch.outcome == 'success'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.patch.outcome == 'success'
        run: npm ci

      - name: Audit IPC contract
        if: steps.patch.outcome == 'success'
        run: npm run verify:ipc

      - name: Typecheck Electron and frontend
        if: steps.patch.outcome == 'success'
        run: npm run typecheck

      - name: Run full regression suite
        if: steps.patch.outcome == 'success'
        run: npm test -- --run

      - name: Verify production build
        if: steps.patch.outcome == 'success'
        run: npm run build

      - name: Commit verified product patch
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          rm -rf .github/rc5-patch
          rm -f .github/workflows/apply-rc5-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce disciplined decision-support safety"
          git push origin HEAD:fix/decision-support-safety-rc5
