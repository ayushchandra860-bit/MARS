name: Apply RC5 decision-support safety

on:
  push:
    branches:
      - fix/decision-support-safety-rc5
    paths:
      - .github/workflows/apply-rc5-safety.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct safety patch
        shell: pwsh
        run: |
          $encoded = (Get-Content .github/rc5-patch/chunk-0.b64 -Raw) + (Get-Content .github/rc5-patch/chunk-1.b64 -Raw)
          $compressed = [Convert]::FromBase64String($encoded)
          $input = [System.IO.MemoryStream]::new($compressed)
          $gzip = [System.IO.Compression.GzipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $reader = [System.IO.StreamReader]::new($gzip)
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/apply-rc5.py", $reader.ReadToEnd())

      - name: Apply safety patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: python "$env:RUNNER_TEMP/apply-rc5.py" *> "$env:RUNNER_TEMP/rc5-patch.log"

      - name: Show patch output
        if: always()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP/rc5-patch.log" -ErrorAction SilentlyContinue

      - name: Save patch error for repair
        if: steps.patch.outcome == 'failure'
        shell: bash
        run: |
          cp "$RUNNER_TEMP/rc5-patch.log" .github/rc5-patch/error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rc5-patch/error.log
          git commit -m "ci: capture RC5 patch error"
          git push origin HEAD:fix/decision-support-safety-rc5
          exit 1

      - uses: actions/setup-node@v4
        if: steps.patch.outcome == 'success'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.patch.outcome == 'success'
        run: npm ci

      - name: Audit IPC contract
        if: steps.patch.outcome == 'success'
        run: npm run verify:ipc

      - name: Typecheck Electron and frontend
        if: steps.patch.outcome == 'success'
        run: npm run typecheck

      - name: Run full regression suite
        if: steps.patch.outcome == 'success'
        run: npm test -- --run

      - name: Verify production build
        if: steps.patch.outcome == 'success'
        run: npm run build

      - name: Commit verified product patch
        if: steps.patch.outcome == 'success'
        shell: bash
        run: |
          rm -rf .github/rc5-patch
          rm -f .github/workflows/apply-rc5-safety.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce disciplined decision-support safety"
          git push origin HEAD:fix/decision-support-safety-rc5
